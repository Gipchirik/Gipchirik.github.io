<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gipchirik - учебный сайт</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Привет, это мой сайт на GitHub Pages</h1>
    <p>Страница сделана для практического задания: HTML, JavaScript, Firebase.</p>

    <section class="card">
      <h2>Счётчик на JavaScript</h2>
      <p>Нажатий: <strong id="counter">0</strong></p>
      <button id="click-button">Нажми меня</button>

      <h2>Firebase</h2>
      <p id="firebase-status">Проверяю подключение...</p>

    <footer>
      <a href="https://github.com/Gipchirik">Мой GitHub</a>
    </footer>

  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>

</html>
